# <!-- proposed: not currently in my repos -->
# Quality gate: lint + format check + test on every push to main and every PR.
# The same commands `make check` runs locally, so a green local gate means a
# green CI. Installs from uv.lock; a stale lockfile fails the run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, and the newest release. Raise the
        # second entry when a new Python ships.
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tag, so pin the release commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
