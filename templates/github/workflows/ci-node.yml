# Quality gate: lint + typecheck + test on every push to main and every PR.
# Tests must be hermetic — committed fixtures, never the live network.
# pnpm version comes from the "packageManager" field in package.json
# (single source of truth; do not pin a second copy here).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
