# This repo's own gate, in two jobs. `playbook` checks the playbook itself.
# `generated` bootstraps a real repo for every kind x stack and runs that repo's
# own gate, so a stale pin or a broken template fails here instead of in the
# next new project.
#
# The weekly run exists to catch upstream drift between edits. GitHub disables
# scheduled workflows after 60 days without repo activity; if the repo has been
# quiet, trigger this by hand (workflow_dispatch) before starting a project.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC; off the hour to avoid the rush
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playbook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck every script
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck
      - name: bootstrap dry-run and real run
        run: |
          scripts/bootstrap.sh --target /tmp/probe --name "Probe Project" \
            --one-liner "CI probe." --tier 2 --stack python \
            --github-user probe --dry-run
          scripts/bootstrap.sh --target /tmp/probe --name "Probe Project" \
            --one-liner "CI probe." --tier 2 --stack python --github-user probe
          # idempotence: second run must skip everything and change nothing
          scripts/bootstrap.sh --target /tmp/probe --name "Probe Project" \
            --one-liner "CI probe." --tier 2 --stack python --github-user probe \
            | grep -q "^done: 0 written"
          # no placeholder may survive a render (workflow files legitimately
          # contain ${{ ... }}, so match the playbook's own {{NAME}} shape only)
          ! grep -rnE '\{\{[A-Z_]+\}\}' /tmp/probe
      - name: awkward values survive a render
        # "&" is special in bash >= 5.2 pattern substitution, and quotes and
        # backslashes are special inside JSON/TOML strings.
        run: |
          for stack in python typescript; do
            scripts/bootstrap.sh --target "/tmp/awk-$stack" --name 'R&D "Tool"' \
              --one-liner 'Watches "X" & reports C:\tmp.' --tier 1 \
              --stack "$stack" --github-user probe >/dev/null
            head -1 "/tmp/awk-$stack/README.md" | grep -qxF '# R&D "Tool"'
          done
          python3 - <<'EOF'
          import json, tomllib
          want = 'Watches "X" & reports C:\\tmp.'
          got = tomllib.load(open("/tmp/awk-python/pyproject.toml", "rb"))["project"]
          assert got["description"] == want, got
          assert got["name"] == "r-d-tool", got
          got = json.load(open("/tmp/awk-typescript/package.json"))
          assert got["description"] == want, got
          print("ok")
          EOF
      - name: templates parse as-is
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'EOF'
          import glob, json, tomllib, yaml
          for f in glob.glob("templates/**/*.yml", recursive=True) + glob.glob(".github/**/*.yml", recursive=True):
              yaml.safe_load(open(f))
              print("ok", f)
          for f in glob.glob("templates/**/*.toml*", recursive=True):
              tomllib.load(open(f, "rb"))
              print("ok", f)
          for f in glob.glob("templates/**/*.json*", recursive=True):
              json.load(open(f))
              print("ok", f)
          EOF
      - name: the playbook's own links resolve
        # templates/ is checked after rendering, in the `generated` job: its
        # links are relative to where the files land, not to where they live.
        run: python3 scripts/check-links.py README.md CLAUDE.md playbooks checklists

  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stack: [python, typescript, docs]
        agents: [research, product]
    env:
      STACK: ${{ matrix.stack }}
      AGENTS: ${{ matrix.agents }}
    steps:
      - uses: actions/checkout@v7
      - name: bootstrap a Tier 2 repo into ./gen
        run: |
          scripts/bootstrap.sh --target gen --name "Gate Probe" \
            --one-liner "CI probe." --tier 2 --stack "$STACK" \
            --agents "$AGENTS" --github-user probe
          git -C gen init -q
          ! grep -rnE '\{\{[A-Z_]+\}\}' gen
      - name: rendered links resolve
        run: python3 scripts/check-links.py gen

      - if: matrix.stack == 'typescript'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: gen/package.json
      - if: matrix.stack == 'typescript'
        uses: actions/setup-node@v7
        with:
          node-version-file: gen/package.json
      - if: matrix.stack == 'typescript'
        name: typescript gate, then the frozen install CI will do
        working-directory: gen
        run: |
          pnpm install
          pnpm check
          pnpm install --frozen-lockfile

      # setup-uv publishes no moving major tag, so pin the release commit.
      - if: matrix.stack == 'python'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - if: matrix.stack == 'python'
        name: python gate, then the locked install CI will do
        working-directory: gen
        run: |
          uv sync
          make check
          uv sync --locked
